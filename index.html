<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오렌지3 지진 데이터 탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 고정 상단바(지진계 파형) + 왼쪽 미션 목록 + 오른쪽 한 번에 한 미션. 휴대폰에서는 미션 목록이 가로 칩으로 바뀜 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --ink:#18212c; --muted:#5a6676; --line:#d9dfe7;
  --accent:#e36d0a; --accent-ink:#ffffff; --accent-soft:#fdecdc;
  --quake:#1d5c86; --quake-soft:#e2eef6;
  --ok:#1c8648; --ok-soft:#e1f3e8; --bad:#c13a30; --bad-soft:#fbe6e3; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --w-data:#ffcf8f; --w-trans:#ffa46e; --w-vis:#ffb2ac; --w-geo:#a9dfa6; --w-ink:#2a1d10;
  --display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19202a; --sunk:#141a22; --ink:#e6ebf1; --muted:#9ba7b6; --line:#2a3441;
  --accent:#ff9a3c; --accent-ink:#1a1006; --accent-soft:#3a2513;
  --quake:#73b4e0; --quake-soft:#1a2c3b;
  --ok:#55c985; --ok-soft:#173226; --bad:#ff7a6e; --bad-soft:#3a1d1a; --warn:#e8bb52; --warn-soft:#352a12;
  --w-data:#b9874a; --w-trans:#bf6a3c; --w-vis:#b56a66; --w-geo:#5f9a5c; --w-ink:#fff6ec;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19202a; --sunk:#141a22; --ink:#e6ebf1; --muted:#9ba7b6; --line:#2a3441;
  --accent:#ff9a3c; --accent-ink:#1a1006; --accent-soft:#3a2513;
  --quake:#73b4e0; --quake-soft:#1a2c3b;
  --ok:#55c985; --ok-soft:#173226; --bad:#ff7a6e; --bad-soft:#3a1d1a; --warn:#e8bb52; --warn-soft:#352a12;
  --w-data:#b9874a; --w-trans:#bf6a3c; --w-vis:#b56a66; --w-geo:#5f9a5c; --w-ink:#fff6ec;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--quake)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 상단바 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 300px}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:.8rem;white-space:nowrap}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who input{width:9.5em;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.prog b{color:var(--ink)}
.seis{display:block;width:100%;height:30px;margin-top:4px}
.seis path{fill:none;stroke:var(--quake);stroke-width:1.2;opacity:.7}
.seis .done{stroke:var(--accent);opacity:1;stroke-width:1.6}

/* ── 본문 레이아웃 ── */
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 80px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
nav.missions{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
nav.missions ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.phase{font-size:.72rem;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px 10px;font-weight:600}
.phase:first-child{margin-top:0}
.mbtn{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer}
.mbtn:hover{background:var(--sunk)}
.mbtn[aria-current="true"]{background:var(--accent-soft)}
.mbtn .no{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.mbtn .nm{font-weight:500;line-height:1.35}
.mbtn .st{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.mbtn .st.full{color:var(--ok);font-weight:600}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px;padding-top:12px}
  nav.missions{position:static;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
  nav.missions ol{flex-direction:row;gap:6px;width:max-content}
  .phase{display:none}
  .mbtn{grid-template-columns:auto auto;width:auto;border:1px solid var(--line);background:var(--surface);padding:6px 12px}
  .mbtn .no{display:none}
  .brand small{display:none}
}

/* ── 미션 ── */
.mission-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--accent);font-weight:700}
.mission-head h2{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.2;margin:0;text-wrap:balance}
.goal{margin:0;color:var(--muted);max-width:62ch}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 4px}
.wdg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;font-size:.82rem;font-weight:600;color:var(--w-ink)}
.wdg i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);display:inline-block}
.wdg.data{background:var(--w-data)} .wdg.trans{background:var(--w-trans)} .wdg.vis{background:var(--w-vis)} .wdg.geo{background:var(--w-geo)}
.wdg.new{box-shadow:0 0 0 2px var(--accent)}
.arrow{color:var(--muted);font-size:.8rem}

.block{margin-top:26px}
.block > h3{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.block > h3 .tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:4px;background:var(--quake-soft);color:var(--quake)}

/* 실습 단계 체크리스트 */
.steps{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.steps li{border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:12px 14px;align-items:start}
.step input[type=checkbox]{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent);cursor:pointer}
.step label{cursor:pointer}
.step.checked label{color:var(--muted)}
.step .sub{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.kbd{font-family:var(--mono);font-size:.82em;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--sunk);white-space:nowrap}
.peek{margin-top:6px}
.peek summary{cursor:pointer;font-size:.82rem;color:var(--quake);font-weight:600;list-style:none;display:inline-flex;gap:4px;align-items:center}
.peek summary::-webkit-details-marker{display:none}
.peek summary::before{content:"▸";transition:transform .15s}
.peek[open] summary::before{transform:rotate(90deg)}
.peek img{display:block;margin-top:8px;border:1px solid var(--line);border-radius:6px;max-width:100%;background:#fff}

/* 문제 카드 */
.qs{display:flex;flex-direction:column;gap:14px}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.q.correct{border-color:var(--ok)}
.q-top{display:flex;gap:10px;align-items:flex-start}
.qno{flex:none;font-family:var(--mono);font-size:.78rem;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-top:2px}
.q.correct .qno{background:var(--ok-soft);color:var(--ok)}
.q-text{font-weight:600;min-width:0}
.q-kind{font-size:.72rem;font-weight:600;color:var(--muted);margin-left:auto;white-space:nowrap;margin-top:3px}
.q-kind.try{color:var(--warn)}
.ans-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.num{width:9em;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);font-family:var(--mono);font-variant-numeric:tabular-nums}
.unit{color:var(--muted);font-size:.9rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:hover{background:var(--sunk)}
.opt input{margin:4px 0 0;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.match{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.match .lbl{font-weight:600}
.match .lbl small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.match select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.match select.ok{border-color:var(--ok)} .match select.no{border-color:var(--bad)}
textarea{width:100%;min-height:76px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);resize:vertical;line-height:1.55}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.fb{font-size:.9rem;padding:9px 12px;border-radius:8px;display:flex;gap:8px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--quake-soft);color:var(--quake)}
.fb.hint{background:var(--warn-soft);color:var(--warn)}
.fb p{margin:0}
.fb .ex{color:var(--ink);display:block;margin-top:2px;font-weight:400}
.fig{border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:420px;height:auto}
.fig svg text{fill:var(--ink);font-family:var(--body)}
.fig svg .axis{stroke:var(--muted)}
.fig svg .box{fill:var(--quake-soft);stroke:var(--quake)}
.fig svg .wh{stroke:var(--quake)}
.fig svg .pin{fill:var(--accent)}
.fig svg .pin-t{fill:var(--accent-ink);font-weight:700}
.fig svg .tick{fill:var(--muted)}

.tip{border-left:3px solid var(--quake);background:var(--quake-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.9rem}
.tip b{color:var(--quake)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}

/* 결과 */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.stat .k{font-size:.78rem;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:.76rem;color:var(--muted);font-weight:600;letter-spacing:.04em;background:var(--sunk)}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.rec{background:var(--quake-soft);color:var(--quake)} .pill.none{background:var(--sunk);color:var(--muted)}
.copybox{width:100%;min-height:140px;font-family:var(--mono);font-size:.8rem}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:.9rem}
/* 저장 상태 */
.cloud{font-family:var(--body);font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.cloud.saved{background:var(--ok-soft);color:var(--ok)} .cloud.pending{background:var(--warn-soft);color:var(--warn)} .cloud.error{background:var(--bad-soft);color:var(--bad)}
.mbtn.teacher{border-top:1px dashed var(--line);border-radius:0 0 8px 8px;margin-top:8px;padding-top:12px}
/* 교사용 */
.bar{position:relative;height:8px;border-radius:4px;background:var(--sunk);min-width:70px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--quake);border-radius:4px}
.bar.lo i{background:var(--bad)} .bar.mid i{background:var(--warn)} .bar.hi i{background:var(--ok)}
.barcell{display:flex;align-items:center;gap:8px;min-width:150px}
.barcell span{font-family:var(--mono);font-size:.8rem;white-space:nowrap;min-width:3.5em;text-align:right}
.dots{display:flex;gap:3px}
.dots b{width:10px;height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.dots b.half{background:var(--warn-soft);border-color:var(--warn)} .dots b.full{background:var(--ok);border-color:var(--ok)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)} tr.sel td{background:var(--accent-soft)}
.wrong{font-size:.8rem;color:var(--muted)}
.wrong em{font-style:normal;color:var(--bad)}
.resp{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.resp li{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);white-space:pre-wrap;font-size:.9rem}
.resp li b{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.detail{border:1px solid var(--accent);border-radius:var(--r);padding:14px;background:var(--surface);margin-top:12px}
.detail h4{margin:0 0 8px;font-size:1rem}
/* 문제 아래 설명 카드 */
.note{border:1px dashed var(--quake);border-radius:var(--r);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.note h4{margin:0;font-size:1rem;color:var(--quake)}
.note-lock{margin:0;color:var(--muted);font-size:.9rem}
.rowtbl th{white-space:nowrap}
.rowtbl td{font-family:var(--mono);font-size:.82rem;white-space:nowrap}
.rowtbl .hot{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cn{display:inline-block;min-width:1.4em;color:var(--accent);font-weight:700;margin-right:2px}
.fig svg .ground{fill:var(--quake-soft)}
.fig svg .strata{stroke:var(--line);stroke-dasharray:6 6}
.fig svg .surface{stroke:var(--ink);stroke-width:2}
.fig svg .wave{fill:none;stroke:var(--bad);stroke-width:1.5;opacity:.7}
.fig svg .w2{opacity:.45} .fig svg .w3{opacity:.25}
.fig svg .hypo{fill:var(--bad)}
.fig svg .epi{fill:var(--accent)}
.fig svg .depth{stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.fig svg .brace{fill:none;stroke:var(--accent);stroke-width:1.5}
.fig svg .house path{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.fig svg .house .door{fill:var(--muted)}
.fig svg .shake{fill:none;stroke:var(--warn);stroke-width:2}
.fig svg .lbl{font-size:14px;font-weight:600}
.fig svg .lbl-s{font-size:12px;fill:var(--muted)}
.fig svg .lbl-hot{font-size:15px;font-weight:700;fill:var(--accent)}
.cols{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.cols div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.cols div.hot{border-color:var(--accent);background:var(--accent-soft)}
.cols dt{font-weight:700}
.cols dd{margin:2px 0 0;font-size:.88rem;color:var(--ink)}
/* PDF(인쇄) 결과지 */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000!important;font-size:11.5px}
  body > *:not(#print){display:none!important}
  #print{display:block!important;color:#000}
  .pr-head{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
  .pr-head h1{margin:0;font-size:18px;font-family:var(--body)}
  .pr-head p{margin:4px 0 0;font-size:12px}
  .pr-sec{margin-top:14px;break-inside:auto}
  .pr-sec h2{font-size:14px;margin:0 0 6px;break-after:avoid}
  #print table{width:100%;border-collapse:collapse;font-size:11px}
  #print th,#print td{border:1px solid #888;padding:5px 7px;text-align:left;vertical-align:top;color:#000;background:#fff}
  #print thead th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print tr{break-inside:avoid}
  #print .c-no{width:3.6em;text-align:center;white-space:nowrap}
  #print .c-res{width:7em;white-space:nowrap}
  #print .c-ans{white-space:pre-wrap;width:32%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>오렌지3 지진 데이터 탐구</h1><small>탐색적 데이터 분석 실습</small></div>
    <div class="who">
      <input id="sid" placeholder="학번" aria-label="학번" autocomplete="off">
      <input id="sname" placeholder="이름" aria-label="이름" autocomplete="off">
    </div>
    <div class="prog" aria-live="polite">맞힌 문제 <b id="pg-ok">0</b>/<span id="pg-all">0</span></div>
  </div>
  <svg class="seis" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"><path id="seis-bg"></path><path id="seis-done" class="done"></path></svg>
</header>

<div class="wrap">
  <nav class="missions" aria-label="미션 목록"><ol id="nav"></ol></nav>
  <main id="main"></main>
</div>

    {type:"mc", q:"[해 보기] 산점도 맨 위 오른쪽에 다른 점들과 떨어져 모여 있는 점들이 있어요. 이 점들은 우리 땅의 어느 쪽에서 일어난 지진일까요?", options:["북한의 북동쪽","제주도","서해 바다","남해 바다"], answer:0, hint:"Y축(위도)은 클수록 북쪽, X축(경도)은 클수록 동쪽이에요.", ex:"위쪽(위도가 큼)이면서 오른쪽(경도가 큼)이므로 한반도의 북동쪽, 북한 지역입니다."},
  ]},

{ id:"share", phase:"공유 및 평가", nav:"정리 · 제출",
  title:"분석 결과 정리하고 나누기",

  flow:[],

  ],

  ]}

/* ───────── 상태 ───────── */
const KEY = "orange3-eqk-v2";
let S = {cur:0, steps:{}, a:{}, sid:"", sname:""};
// 답은 이 창(탭)에만 저장되고, 창을 닫으면 자동으로 사라집니다. (새로고침은 유지)
try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY+"-cid"); }catch(e){} // 예전 버전이 남긴 기록 지우기
try{ const raw = sessionStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ sessionStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

let VIEW="mission";

const ALL = [];
MISSIONS.forEach((m,mi)=>m.qs.forEach((q,qi)=>{ q.id = m.id+"-"+(qi+1); q.mi=mi; q.no=qi+1; ALL.push(q); }));
const graded = q => ["num","mc","multi","match"].includes(q.type) || (q.type==="record" && q.answer!=null);
const isDone = q => { const a=S.a[q.id]; if(!a) return false; return graded(q) ? a.ok===true : (a.v!=null && String(a.v).trim()!==""); };

/* ───────── 지진계 파형 ───────── */
(function(){
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const pts=[]; for(let x=0;x<=1000;x+=4){
    let amp=1.2+rnd()*1.5;
    [[230,40,9],[520,60,13],[780,30,7]].forEach(([c,w,a])=>{const d=Math.abs(x-c); if(d<w) amp+=a*(1-d/w)*(0.4+rnd()*0.6);});
    pts.push([x,15+(x/4%2?1:-1)*amp]);
  }
  window.SEIS = pts;
})();
function drawSeis(frac){
  const d = SEIS.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1].toFixed(1)).join(" ");
  document.getElementById("seis-bg").setAttribute("d", d);
  const n = Math.round(SEIS.length*frac);
  document.getElementById("seis-done").setAttribute("d", n>1 ? SEIS.slice(0,n).map((p,i)=>(i?"L":"M")+p[0]+" "+p[1].toFixed(1)).join(" ") : "");
}

/* ───────── 그리기 ───────── */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function missionStat(m){
  const qs=m.qs; const done=qs.filter(isDone).length; return {done,all:qs.length};
}
function renderNav(){
  let html="", last="";
  MISSIONS.forEach((m,i)=>{
    if(m.phase!==last){ html+=`<li class="phase">${m.phase}</li>`; last=m.phase; }
    const st=missionStat(m);
    html+=`<li><button class="mbtn" data-i="${i}" aria-current="${VIEW==="mission"&&i===S.cur}"><span class="no">${String(i).padStart(2,"0")}</span><span class="nm">${m.nav}</span><span class="st ${st.done===st.all?"full":""}">${st.done}/${st.all}</span></button></li>`;
  });
  $("#nav").innerHTML=html;
  const g=ALL.filter(graded), ok=g.filter(isDone).length;
  $("#pg-ok").textContent=ok; $("#pg-all").textContent=g.length;
  drawSeis(ALL.filter(isDone).length/ALL.length);
}

function flowHTML(flow){
  if(!flow.length) return "";
  return `<div class="flow" aria-label="이번 미션의 위젯 연결">${flow.map((w,i)=>(i?'<span class="arrow">→</span>':'')+`<span class="wdg ${w.c} ${w.isNew?"new":""}"><i></i>${w.n}</span>`).join("")}</div>`;
}

function boxFig(){
  // 진앙(km) 박스 플롯 모식도 (0~35km 눈금)
  const X=v=>40+v*(560/35);
  const ticks=[0,5,10,15,20,25,30,35].map(v=>`<line class="axis" x1="${X(v)}" x2="${X(v)}" y1="150" y2="156"/><text class="tick" x="${X(v)}" y="172" font-size="12" text-anchor="middle">${v}</text>`).join("");
  const pin=(x,y,t)=>`<circle class="pin" cx="${x}" cy="${y}" r="11"/><text class="pin-t" x="${x}" y="${y+4.5}" font-size="12" text-anchor="middle">${t}</text>`;
  return `<div class="fig"><svg viewBox="0 0 640 185" role="img" aria-label="진앙 박스 플롯 모식도">
    <line class="axis" x1="${X(0)}" x2="${X(35)}" y1="150" y2="150" stroke-width="1.5"/>${ticks}
    <text class="tick" x="${X(17.5)}" y="184" font-size="11" text-anchor="middle">진앙(km)</text>
    <line class="wh" x1="${X(0)}" x2="${X(8)}" y1="95" y2="95" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line class="wh" x1="${X(17)}" x2="${X(35)}" y1="95" y2="95" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line class="wh" x1="${X(0)}" x2="${X(0)}" y1="88" y2="102" stroke-width="1.5"/>
    <line class="wh" x1="${X(35)}" x2="${X(35)}" y1="88" y2="102" stroke-width="1.5"/>
    <rect class="box" x="${X(8)}" y="80" width="${X(17)-X(8)}" height="30" stroke-width="1.5"/>
    <line class="wh" x1="${X(13)}" x2="${X(13)}" y1="80" y2="110" stroke-width="2.5"/>
    <line class="wh" x1="${X(12.85-6.5)}" x2="${X(12.85+6.5)}" y1="64" y2="64" stroke-width="1.5"/>
    <line class="wh" x1="${X(12.85)}" x2="${X(12.85)}" y1="58" y2="70" stroke-width="2"/>
    <text x="${X(12.85)}" y="48" font-size="12" text-anchor="middle">12.85 ± 6.5</text>
    ${pin(X(0),125,"㉠")}${pin(X(13),128,"㉡")}${pin(X(35),125,"㉢")}${pin(X(8)-4,128,"㉣")}${pin(X(17)+4,128,"㉤")}${pin(X(12.85)-30,30,"㉥")}${pin(X(12.85)+56,30,"㉦")}
  </svg></div>`;
}

function qHTML(q){
  const a=S.a[q.id]||{};
  const kind={num:"숫자 입력",mc:"하나 고르기",multi:"모두 고르기",match:"짝 맞추기",record:"직접 측정·기록",text:"서술"}[q.type];
  let body="";
  if(q.figure==="boxfig") body+=boxFig();
  if(q.type==="num" || (q.type==="record" && q.numeric)){
    body+=`<div class="ans-row"><input class="num" id="in-${q.id}" inputmode="decimal" value="${esc(a.v)}" aria-label="답"> ${q.unit?`<span class="unit">${q.unit}</span>`:""}</div>`;
  } else if(q.type==="mc" || q.type==="multi"){
    const multi=q.type==="multi"; const sel = multi ? (a.v||[]) : a.v;
    body+=`<div class="opts" role="${multi?"group":"radiogroup"}">`+q.options.map((o,i)=>{
      const on = multi ? sel.includes(i) : sel===i;
      return `<label class="opt ${on?"sel":""}"><input type="${multi?"checkbox":"radio"}" name="in-${q.id}" id="in-${q.id}-${i}" value="${i}" ${on?"checked":""}><span>${o}</span></label>`;
    }).join("")+`</div>`;
  } else if(q.type==="match"){
    const v=a.v||{};
    body+=`<div class="match">`+q.items.map((it,i)=>{
      const cls = a.checked ? (Number(v[i])===it.a?"ok":"no") : "";
      return `<span class="lbl">${it.l}${it.s?`<small>${it.s}</small>`:""}</span><select id="in-${q.id}-${i}" data-i="${i}" class="${cls}"><option value="">선택하세요</option>${q.options.map((o,j)=>`<option value="${j}" ${String(v[i])===String(j)?"selected":""}>${o}</option>`).join("")}</select>`;
    }).join("")+`</div>`;
  } else {
    body+=`<textarea id="in-${q.id}" placeholder="${esc(q.placeholder||"")}" ${q.type==="record"&&!q.long?'style="min-height:44px"':""}>${esc(a.v)}</textarea>`;
  }

  const canCheck = graded(q);
  let btns=`<div class="btns">`;
  btns+= canCheck ? `<button class="btn primary" data-act="check" data-q="${q.id}">채점하기</button>` : `<button class="btn primary" data-act="save" data-q="${q.id}">기록하기</button>`;
  if(q.hint) btns+=`<button class="btn ghost" data-act="hint" data-q="${q.id}">힌트</button>`;
  if(canCheck && (a.tries||0)>=3 && !a.ok) btns+=`<button class="btn ghost" data-act="reveal" data-q="${q.id}">정답 보기</button>`;
  btns+=`</div>`;

  let fb="";
  if(a.showHint && q.hint) fb+=`<div class="fb hint"><p>힌트: ${q.hint}${q.hintImg&&IMG[q.hintImg]?`<img src="${IMG[q.hintImg]}" alt="힌트 화면" style="display:block;margin-top:8px;max-width:220px;border-radius:6px">`:""}</p></div>`;
  if(canCheck && a.checked){
    if(a.ok) fb+=`<div class="fb ok"><p>정답입니다.${q.ex?`<span class="ex">${q.ex}</span>`:""}</p></div>`;
    else fb+=`<div class="fb no"><p>${a.partial||"다시 확인해 보세요."} ${(a.tries||0)<3?"오렌지 화면을 한 번 더 보고 고쳐 보세요.":""}</p></div>`;
  }
  if(a.revealed && !a.ok) fb+=`<div class="fb info"><p>정답: ${answerText(q)}${q.ex?`<span class="ex">${q.ex}</span>`:""}</p></div>`;
  if(!canCheck && a.saved) fb+=`<div class="fb info"><p>기록했습니다. 결과는 마지막 '정리 · 제출'에 모입니다.</p></div>`;

  return `<article class="q ${isDone(q)&&canCheck?"correct":""}" id="q-${q.id}">
    <div class="q-top"><span class="qno">${q.no}</span><span class="q-text">${q.q}</span><span class="q-kind ${a.tries&&!a.ok&&canCheck?"try":""}">${kind}${a.tries&&canCheck?` · ${a.tries}회`:""}</span></div>
    ${body}${btns}${fb}</article>`;
}

function answerText(q){
  if(q.type==="num"||q.type==="record") return q.answer+(q.unit?" "+q.unit:"");
  if(q.type==="mc") return q.options[q.answer];
  if(q.type==="multi") return q.answer.map(i=>q.options[i]).join(", ");
  if(q.type==="match") return q.items.map(it=>`${it.l} → ${q.options[it.a]}`).join(" · ");
  return "";
}

function renderMission(){
  const i=S.cur, m=MISSIONS[i];
  if(m.id==="share"){ renderShare(); return; }
  const steps = m.steps.map((s,k)=>{
    const key=m.id+"-"+k, on=!!S.steps[key];
    const peek = s.img && IMG[s.img] ? `<details class="peek" ${s.open?"open":""}><summary>화면 보기 · ${s.cap||""}</summary><img src="${IMG[s.img]}" alt="${esc(s.cap||"오렌지 화면")}" loading="lazy"></details>` : "";
    return `<li><div class="step ${on?"checked":""}"><input type="checkbox" id="st-${key}" data-step="${key}" ${on?"checked":""}><div><label for="st-${key}">${s.t}</label>${s.sub?`<span class="sub">${s.sub}</span>`:""}${peek}</div></div></li>`;
  }).join("");
  $("#main").innerHTML = `
    <div class="mission-head"><span class="eyebrow">${String(i).padStart(2,"0")} · ${m.phase}</span><h2>${m.title}</h2><p class="goal">${m.goal}</p>${flowHTML(m.flow)}</div>
    <section class="block"><h3><span class="tag">실습</span>오렌지에서 따라 하기</h3><ol class="steps">${steps}</ol></section>
    <section class="block"><h3><span class="tag">문제</span>화면을 보고 답하기</h3><div class="qs">${m.qs.map(q=>qHTML(q)+noteHTML(q)).join("")}</div></section>
    ${pager(i)}`;
}

function pager(i){
  return `<div class="pager">${i>0?`<button class="btn" data-go="${i-1}">← ${MISSIONS[i-1].nav}</button>`:"<span></span>"}${i<MISSIONS.length-1?`<button class="btn primary" data-go="${i+1}">${MISSIONS[i+1].nav} →</button>`:""}</div>`;
}

function shortAns(q, a=S.a[q.id]){
  if(!a || a.v==null || a.v==="") return "";
  if(q.type==="mc") return q.options[a.v]??"";
  if(q.type==="multi") return (a.v||[]).map(i=>q.options[i]).join(", ");
  if(q.type==="match") return q.items.map((it,i)=>`${it.l}→${q.options[a.v[i]]??"?"}`).join(" ");
  return String(a.v);
}

/* ───────── 문제 아래 설명 카드 ───────── */
const NOTES = {
  "intro-1": { title:"첫 번째 행으로 속성 읽기", body: colsNote }
};
function noteHTML(q){
  const n = NOTES[q.id]; if(!n) return "";
  const a = S.a[q.id]||{};
  const open = isDone(q) || a.revealed;
  return `<section class="note" id="note-${q.id}">${open ? `<h4>${n.title}</h4>${n.body()}`
    : `<p class="note-lock">🔒 1번 문제를 맞히면 각 열(속성)이 무엇을 뜻하는지 그림 설명이 열립니다.</p>`}</section>`;
}
function updateNote(q){
  const el=document.getElementById("note-"+q.id); if(!el) return;
  const tmp=document.createElement("div"); tmp.innerHTML=noteHTML(q); el.replaceWith(tmp.firstElementChild);
}
function colsNote(){
  const cols=[
    ["①","시간","2016-03-02 14:04:43"],["②","규모","2.7"],["③","진앙(km)","3"],
    ["④","위도","36.35"],["⑤","경도","127.20"],["⑥","위치","충남 공주시 남동쪽 13km 지역"]];
  const table=`<div class="tbl-wrap"><table class="rowtbl"><thead><tr>${cols.map(c=>`<th><span class="cn">${c[0]}</span>${c[1]}</th>`).join("")}</tr></thead>
    <tbody><tr>${cols.map(c=>`<td class="${c[1]==="진앙(km)"?"hot":""}">${c[2]}</td>`).join("")}</tr></tbody></table></div>`;
  const fig=`<div class="fig"><svg viewBox="0 0 640 320" role="img" aria-label="진원, 진앙, 깊이를 나타낸 땅 단면 그림">
    <rect class="ground" x="20" y="96" width="600" height="206"/>
    <line class="strata" x1="20" x2="620" y1="150" y2="150"/><line class="strata" x1="20" x2="620" y1="205" y2="205"/><line class="strata" x1="20" x2="620" y1="258" y2="258"/>
    <line class="surface" x1="20" x2="620" y1="96" y2="96"/>
    <text class="lbl-s" x="28" y="90">땅 표면</text><text class="lbl-s" x="28" y="292">땅속</text>
    <circle class="wave" cx="200" cy="232" r="22"/><circle class="wave w2" cx="200" cy="232" r="44"/><circle class="wave w3" cx="200" cy="232" r="68"/>
    <line class="depth" x1="200" x2="200" y1="100" y2="226"/>
    <path class="brace" d="M214 100 h8 v126 h-8"/>
    <text class="lbl-hot" x="232" y="150">깊이 3km</text>
    <text class="lbl-s" x="232" y="168">→ 데이터의 ③ '진앙(km)' 값</text>
    <circle class="hypo" cx="200" cy="232" r="9"/>
    <text class="lbl" x="200" y="282" text-anchor="middle">진원: 땅속에서 지진이 시작된 곳</text>
    <path class="epi" d="M200 82 l5 10 l11 1 l-8 7 l3 11 l-11 -6 l-11 6 l3 -11 l-8 -7 l11 -1z" transform="translate(0,-6)"/>
    <text class="lbl" x="200" y="40" text-anchor="middle">진앙: 진원 바로 위 땅 표면</text>
    <text class="lbl-s" x="200" y="58" text-anchor="middle">④ 위도 36.35° · ⑤ 경도 127.20°</text>
    <text class="lbl" x="330" y="232">② 규모 2.7</text>
    <text class="lbl-s" x="330" y="250">진원에서 나온 에너지의 크기</text>
    <text class="lbl-s" x="612" y="314" text-anchor="end">※ 실제 거리 비율과 다릅니다</text>
  </svg></div>`;
  const dl=`<dl class="cols">
    <div><dt><span class="cn">①</span>시간</dt><dd>지진이 일어난 날짜와 시각입니다.</dd></div>
    <div><dt><span class="cn">②</span>규모</dt><dd>지진이 낸 <b>에너지의 크기</b>입니다. 지진 하나에 값이 하나뿐이고, 1 커지면 에너지는 약 32배가 됩니다.</dd></div>
    <div class="hot"><dt><span class="cn">③</span>진앙(km)</dt><dd>열 이름은 '진앙'이지만, 값은 <b>진원의 깊이</b>입니다. 이 지진은 진앙 아래 <b>땅속 3km</b>에서 시작되었다는 뜻이에요. 값이 클수록 깊은 곳에서 일어난 지진입니다.</dd></div>
    <div><dt><span class="cn">④⑤</span>위도 · 경도</dt><dd>진앙이 지도에서 어디인지 나타내는 좌표입니다. 위도는 남북, 경도는 동서 위치예요.</dd></div>
    <div><dt><span class="cn">⑥</span>위치</dt><dd>진앙을 사람이 읽기 쉬운 말로 적은 것입니다. 숫자가 아니라 01번 미션에서 meta로 바꿉니다.</dd></div>
  </dl>`;
  return `<p class="goal" style="margin:0">EQK.csv의 첫 번째 행을 예로 각 열의 뜻을 살펴봅시다.</p>${table}${fig}${dl}`;
}

function statusPill(q){
  const a=S.a[q.id];
  if(graded(q)){ if(a&&a.ok) return `<span class="pill ok">정답${a.tries>1?` (${a.tries}회)`:""}</span>`; if(a&&a.checked) return `<span class="pill no">오답${a.revealed?" · 정답 확인":""}</span>`; return `<span class="pill none">안 함</span>`; }
  return isDone(q)?`<span class="pill rec">기록</span>`:`<span class="pill none">안 함</span>`;
}


function renderShare(){
  const i=S.cur, m=MISSIONS[i];
  const g=ALL.filter(graded), ok=g.filter(isDone).length, first=g.filter(q=>S.a[q.id]?.ok && S.a[q.id].tries===1).length;
  const rec=ALL.filter(q=>!graded(q)), recDone=rec.filter(isDone).length;
  const steps = m.steps.map((s,k)=>{
    const key=m.id+"-"+k, on=!!S.steps[key];
    const peek = s.img && IMG[s.img] ? `<details class="peek" ${s.open?"open":""}><summary>화면 보기 · ${s.cap||""}</summary><img src="${IMG[s.img]}" alt="${esc(s.cap||"")}"></details>` : "";
    return `<li><div class="step ${on?"checked":""}"><input type="checkbox" id="st-${key}" data-step="${key}" ${on?"checked":""}><div><label for="st-${key}">${s.t}</label>${peek}</div></div></li>`;
  }).join("");
  const rows = ALL.filter(q=>q.mi<i).map(q=>`<tr><td class="mono">${String(q.mi).padStart(2,"0")}-${q.no}</td><td>${q.q.replace(/<[^>]+>/g,"")}</td><td>${esc(shortAns(q))}</td><td>${statusPill(q)}</td></tr>`).join("");
  $("#main").innerHTML = `
    <div class="mission-head"><span class="eyebrow">${String(i).padStart(2,"0")} · ${m.phase}</span><h2>${m.title}</h2><p class="goal">${m.goal}</p></div>
    <div class="sum-grid">
      <div class="stat"><div class="k">맞힌 문제</div><div class="v">${ok}/${g.length}</div></div>
      <div class="stat"><div class="k">한 번에 맞힘</div><div class="v">${first}</div></div>
      <div class="stat"><div class="k">기록·서술 완료</div><div class="v">${recDone}/${rec.length}</div></div>
    </div>
    <section class="block"><h3><span class="tag">점검</span>작업 마무리</h3><ol class="steps">${steps}</ol></section>
    <section class="block"><h3><span class="tag">평가</span>생각 정리하기</h3><div class="qs">${m.qs.map(qHTML).join("")}</div></section>
    <section class="block"><h3><span class="tag">확인</span>내 답안 모아 보기</h3>
      <div class="tbl-wrap"><table><thead><tr><th>번호</th><th>문제</th><th>내 답</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section class="block"><h3><span class="tag">제출</span>PDF로 저장하기</h3>
      <p class="goal" style="margin:0 0 10px;max-width:none">인쇄 창이 열리면 <b>대상</b>을 <b>PDF로 저장</b>으로 바꾸고 <b>저장</b>을 누르세요.</p>
      <div class="btns"><button class="btn primary" data-act="pdf">PDF로 저장</button></div>
      <div id="pdf-msg"></div>
    </section>
    ${pager(i)}`;
}

function printHTML(){
  const g=ALL.filter(graded), ok=g.filter(isDone).length;
  const today=new Date().toLocaleDateString("ko-KR");
  const res=q=>{ const a=S.a[q.id];
    if(graded(q)) return a?.ok?`정답${a.tries>1?` (${a.tries}회)`:""}`:a?.checked?`오답${a.revealed?" · 정답 확인":""}`:"안 함";
    return isDone(q)?"기록":"안 함"; };
  return `<header class="pr-head"><h1>오렌지3 지진 데이터 탐구 · 실습 결과</h1>
    <p>학번 ${esc(S.sid)} · 이름 ${esc(S.sname)} · ${today} · 맞힌 문제 ${ok}/${g.length}</p></header>`
    + MISSIONS.map((m,mi)=>`<section class="pr-sec"><h2>${String(mi).padStart(2,"0")} ${esc(m.title)}</h2>
      <table><thead><tr><th class="c-no">번호</th><th>문제</th><th>내 답</th><th class="c-res">결과</th></tr></thead><tbody>
      ${m.qs.map(q=>`<tr><td class="c-no">${q.no}</td><td>${q.q.replace(/<[^>]+>/g,"")}</td><td class="c-ans">${esc(shortAns(q))||"—"}</td><td class="c-res">${res(q)}</td></tr>`).join("")}
      </tbody></table></section>`).join("");
}

/* ───────── 채점 ───────── */
function parseNum(s){ const v=parseFloat(String(s).replace(/,/g,"").replace(/[^\d.\-]/g,"")); return isNaN(v)?null:v; }
function check(q){
  const a=S.a[q.id]=S.a[q.id]||{}; read(q);
  let ok=false; a.partial="";
  if(q.type==="num"||q.type==="record"){
    const v=parseNum(a.v);
    if(v===null){ a.partial="숫자를 입력하세요."; a.checked=true; return; }
    ok = Math.abs(v-q.answer)<=(q.tol||0)+1e-9;
  } else if(q.type==="mc"){
    if(a.v==null){ a.partial="보기를 하나 고르세요."; a.checked=true; return; }
    ok = a.v===q.answer;
  } else if(q.type==="multi"){
    const s=[...(a.v||[])].sort().join(","), t=[...q.answer].sort().join(",");
    ok = s===t;
    if(!ok){ const right=(a.v||[]).filter(x=>q.answer.includes(x)).length, wrong=(a.v||[]).length-right; a.partial=`맞게 고른 것 ${right}개, 잘못 고른 것 ${wrong}개입니다.`; }
  } else if(q.type==="match"){
    const n=q.items.filter((it,i)=>Number(a.v?.[i])===it.a && a.v?.[i]!=="" && a.v?.[i]!=null).length;
    ok = n===q.items.length;
    if(!ok) a.partial=`${q.items.length}개 중 ${n}개를 맞혔습니다. 빨간 테두리 칸을 고쳐 보세요.`;
  }
  a.checked=true; if(!a.ok) a.tries=(a.tries||0)+1; a.ok=ok;
}
function read(q){
  const a=S.a[q.id]=S.a[q.id]||{};
  if(q.type==="mc"){ const el=document.querySelector(`input[name="in-${q.id}"]:checked`); a.v= el?Number(el.value):null; }
  else if(q.type==="multi"){ a.v=[...document.querySelectorAll(`input[name="in-${q.id}"]:checked`)].map(e=>Number(e.value)); }
  else if(q.type==="match"){ a.v={}; q.items.forEach((_,i)=>{ a.v[i]=document.getElementById(`in-${q.id}-${i}`).value; }); }
  else { const el=document.getElementById(`in-${q.id}`); if(el) a.v=el.value; }
}
const qById = id => ALL.find(q=>q.id===id);

function rerenderQ(q){
  const el=document.getElementById("q-"+q.id); if(!el) return;
  const tmp=document.createElement("div"); tmp.innerHTML=qHTML(q); el.replaceWith(tmp.firstElementChild);
}

/* ───────── 이벤트 ───────── */
document.addEventListener("click",e=>{
  const nb=e.target.closest(".mbtn"); if(nb){ go(Number(nb.dataset.i)); return; }
  const gb=e.target.closest("[data-go]"); if(gb){ go(Number(gb.dataset.go)); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, q=b.dataset.q?qById(b.dataset.q):null;
  if(act==="check"){ check(q); save(true); rerenderQ(q); updateNote(q); renderNav(); }
  else if(act==="save"){ read(q); S.a[q.id].saved=true; save(true); rerenderQ(q); renderNav(); }
  else if(act==="hint"){ const a=S.a[q.id]=S.a[q.id]||{}; read(q); a.showHint=!a.showHint; save(); rerenderQ(q); }
  else if(act==="reveal"){ read(q); S.a[q.id].revealed=true; save(true); rerenderQ(q); updateNote(q); }
  else if(act==="pdf"){
    const msg=$("#pdf-msg"), sid=String(S.sid||"").trim(), sname=String(S.sname||"").trim();
    if(!sid || !sname){ msg.innerHTML='<div class="fb no" style="margin-top:10px"><p>맨 위에 학번과 이름을 먼저 적어 주세요.</p></div>'; $("#sid").focus(); return; }
    msg.innerHTML="";
    $("#print").innerHTML=printHTML();
    const title=document.title;
    document.title=`오렌지3지진데이터_${sid}_${sname}`.replace(/[\\/:*?"<>|]/g,"");   // PDF 파일 이름
    const done=()=>{ document.title=title; window.removeEventListener("afterprint",done); };
    window.addEventListener("afterprint",done);
    window.print();
  }
});
document.addEventListener("change",e=>{
  const st=e.target.dataset.step;
  if(st){ S.steps[st]=e.target.checked; e.target.closest(".step").classList.toggle("checked",e.target.checked); save(); return; }
  const opt=e.target.closest(".opt");
  if(opt){ const grp=opt.parentElement; grp.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked)); }
  const qa=e.target.closest(".q"); if(qa){ const q=qById(qa.id.slice(2)); if(q){ read(q); save(); } }
});
document.addEventListener("input",e=>{
  if(e.target.id==="sid"){ S.sid=e.target.value; save(true); }
  else if(e.target.id==="sname"){ S.sname=e.target.value; save(true); }
  else { const qa=e.target.closest(".q"); if(qa){ const q=qById(qa.id.slice(2)); if(q){ read(q); save(!graded(q)); } } }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.classList.contains("num")){ const qa=e.target.closest(".q"); const q=qById(qa.id.slice(2)); if(graded(q)){ check(q); save(true); rerenderQ(q); renderNav(); document.getElementById("in-"+q.id)?.focus(); } }
});

function go(i){
  VIEW="mission";
  S.cur=Math.max(0,Math.min(MISSIONS.length-1,i)); save();
  renderNav(); renderMission();
  try{ history.replaceState(null,"","#"+MISSIONS[S.cur].id); }catch(e){}
  window.scrollTo({top:0,behavior:"auto"});
}

$("#sid").value=S.sid||""; $("#sname").value=S.sname||"";
const h=(location.hash||"").slice(1); const hi=MISSIONS.findIndex(m=>m.id===h);
go(hi>=0?hi:(S.cur||0));
// 답을 적은 뒤 창을 닫으려 하면 한 번 묻기 (닫으면 답이 지워짐)
window.addEventListener("beforeunload",e=>{ if(Object.keys(S.a).length || S.sid || S.sname){ e.preventDefault(); e.returnValue=""; } });
</script>
